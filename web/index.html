<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>订阅 · clash-sub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <svg class="glyph" width="14" height="15" viewBox="0 0 14 15" fill="none" aria-hidden="true">
      <path d="M2.5 1v12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M2.5 4.5h5.5M2.5 11h8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="10" cy="4.5" r="1.7" fill="currentColor"/>
      <circle cx="12" cy="11" r="1.7" fill="currentColor"/>
    </svg>
    <span class="word">clash-sub</span>
  </a>

  <span class="spacer"></span>

  <button class="iconbtn" type="button" data-theme-toggle aria-label="切换外观">
    <svg data-icon-light width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.4"/>
      <path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1M12.9 12.9l-1.1-1.1M4.2 4.2L3.1 3.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <svg data-icon-dark width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" hidden>
      <path d="M13.4 9.6A5.8 5.8 0 016.4 2.6a5.9 5.9 0 107 7z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    </svg>
  </button>

  <span class="who">
    <span class="avatar" id="initial" aria-hidden="true"></span>
    <span class="name" id="username"></span>
  </span>

  <button class="iconbtn" type="button" id="logout" aria-label="退出登录" title="退出登录">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M6.2 2.5H3.4a.9.9 0 00-.9.9v9.2a.9.9 0 00.9.9h2.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M10.4 5.3L13.1 8l-2.7 2.7M12.8 8H6.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</header>

<main class="page">

  <div class="pagehead">
    <h1>订阅</h1>
    <span class="count" id="count"></span>
    <span class="spacer"></span>
    <a class="btn btn--primary" href="editor.html?new=1">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      新建订阅
    </a>
  </div>

  <div class="toolrow">
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <circle cx="6.2" cy="6.2" r="4.3" stroke="currentColor" stroke-width="1.4"/>
        <path d="M9.5 9.5l2.6 2.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <input class="input" id="filter" type="search" placeholder="按名称查找" aria-label="按名称查找订阅">
    </div>
  </div>

  <div class="tree" id="tree" aria-busy="true">
    <div class="empty" id="loading"><p style="margin:0">正在读取订阅…</p></div>
  </div>
</main>

<!-- 删除确认 -->
<div class="scrim" id="dlg-del" hidden role="dialog" aria-modal="true" aria-labelledby="delhead">
  <div class="dialog">
    <h2 id="delhead">删除“<span id="delname"></span>”？</h2>
    <p>订阅地址会立刻失效，已经导入这条地址的客户端将无法再更新配置。此操作无法撤销。</p>
    <div class="acts">
      <button class="btn" type="button" data-close data-autofocus>取消</button>
      <button class="btn btn--danger" type="button" id="delok">删除订阅</button>
    </div>
  </div>
</div>

<!-- 二维码 -->
<div class="scrim" id="dlg-qr" hidden role="dialog" aria-modal="true" aria-labelledby="qrhead">
  <div class="dialog">
    <h2 id="qrhead">扫码导入</h2>
    <p>在手机 Clash 客户端里扫这张码，直接添加订阅。</p>
    <div class="qr" id="qrbox"></div>
    <div class="acts">
      <button class="btn" type="button" id="qrcopy">复制地址</button>
      <button class="btn btn--primary" type="button" data-close data-autofocus>完成</button>
    </div>
  </div>
</div>

<script src="assets/vendor/qrcode.min.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  'use strict';

  var tree = document.getElementById('tree');
  var countEl = document.getElementById('count');
  var filter = document.getElementById('filter');
  var items = [];

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function subUrl(token) { return location.origin + '/subscribe?token=' + token; }

  function ago(iso) {
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 60) return '刚刚';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    if (s < 172800) return '昨天';
    if (s < 2592000) return Math.floor(s / 86400) + ' 天前';
    return new Date(iso).toLocaleDateString('zh-CN');
  }

  function row(it) {
    var url = subUrl(it.token);
    var tag = it.enabled
      ? '<span class="tag tag--live"><span class="dot dot--live"></span>已启用</span>'
      : '<span class="tag tag--draft"><span class="dot dot--draft"></span>已停用</span>';

    return '<article class="node" data-id="' + it.id + '" data-name="' + esc(it.name) + '" data-token="' + it.token + '">' +
      '<span class="guide" aria-hidden="true"></span>' +
      '<div>' +
        '<div class="title"><a href="editor.html?id=' + it.id + '">' + esc(it.name) + '</a>' + tag + '</div>' +
        (it.note ? '<p class="note">' + esc(it.note) + '</p>' : '') +
        '<div class="sub">' +
          '<span class="url">/subscribe?token=<b>' + it.token + '</b></span>' +
          '<button class="minibtn" type="button" data-copy="' + url + '">复制</button>' +
        '</div>' +
        '<div class="mobilemeta"><span>' + it.proxies + ' 节点</span><span>' + it.rules + ' 规则</span><span>' + ago(it.updated_at) + '</span></div>' +
      '</div>' +
      '<div class="metric' + (it.proxies ? '' : ' zero') + '">' + it.proxies + '<span>节点</span></div>' +
      '<div class="metric' + (it.rules ? '' : ' zero') + '">' + it.rules + '<span>规则</span></div>' +
      '<div class="when">' + ago(it.updated_at) + '</div>' +
      '<div class="acts">' +
        '<a class="btn btn--quiet" href="editor.html?id=' + it.id + '">编辑</a>' +
        '<button class="btn btn--quiet" type="button" data-qr>二维码</button>' +
        '<button class="btn btn--quiet btn--danger" type="button" data-del>删除</button>' +
      '</div>' +
    '</article>';
  }

  function render() {
    var q = filter.value.trim().toLowerCase();
    var vis = items.filter(function (it) {
      return !q || it.name.toLowerCase().indexOf(q) >= 0;
    });

    countEl.textContent = q ? vis.length + ' / ' + items.length : items.length + ' 个';

    if (!vis.length) {
      tree.innerHTML = '<div class="empty">' +
        (q
          ? '<h2>没有匹配“' + esc(filter.value.trim()) + '”的订阅</h2><p>换个名称再试，或者新建一个。</p>'
          : '<h2>还没有订阅</h2><p>新建一个订阅，写好 Clash 配置，就能拿到一条带 token 的订阅地址。</p>') +
        '<a class="btn btn--primary" href="editor.html?new=1">新建订阅</a></div>';
      return;
    }
    tree.innerHTML = vis.map(row).join('');
  }

  function load() {
    return api('GET', '/api/subscriptions').then(function (list) {
      items = list || [];
      tree.setAttribute('aria-busy', 'false');
      render();
    }).catch(function (e) {
      tree.setAttribute('aria-busy', 'false');
      tree.innerHTML = '<div class="empty"><h2>读取订阅失败</h2><p>' + esc(e.message) + '</p>' +
        '<button class="btn" type="button" onclick="location.reload()">重试</button></div>';
    });
  }

  filter.addEventListener('input', render);

  /* 谁登录着 */
  api('GET', '/api/me').then(function (me) {
    document.getElementById('username').textContent = me.username;
    document.getElementById('initial').textContent = (me.username || '?').charAt(0).toUpperCase();
  });

  document.getElementById('logout').addEventListener('click', function () {
    api('POST', '/api/logout').then(function () { location.replace('login.html'); });
  });

  /* 删除 */
  var pending = null;
  tree.addEventListener('click', function (e) {
    var b = e.target.closest('[data-del]');
    if (!b) return;
    pending = b.closest('.node');
    document.getElementById('delname').textContent = pending.dataset.name;
    window.openDialog('dlg-del');
  });

  document.getElementById('delok').addEventListener('click', function () {
    if (!pending) return;
    var id = pending.dataset.id, name = pending.dataset.name;
    var btn = this;
    btn.disabled = true;
    api('DELETE', '/api/subscriptions/' + id)
      .then(function () {
        items = items.filter(function (it) { return String(it.id) !== String(id); });
        render();
        window.toast('已删除“' + name + '”');
      })
      .catch(function (err) { window.toast(err.message, 'error'); })
      .then(function () {
        btn.disabled = false;
        pending = null;
        window.closeDialog('dlg-del');
      });
  });

  /* 二维码 */
  tree.addEventListener('click', function (e) {
    var b = e.target.closest('[data-qr]');
    if (!b) return;
    var url = subUrl(b.closest('.node').dataset.token);
    var box = document.getElementById('qrbox');
    box.innerHTML = '';
    new QRCode(box, { text: url, width: 188, height: 188, colorDark: '#10231d', colorLight: '#ffffff' });
    document.getElementById('qrcopy').setAttribute('data-copy', url);
    window.openDialog('dlg-qr');
  });

  load();
})();
</script>
</body>
</html>
